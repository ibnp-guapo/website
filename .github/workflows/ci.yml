name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-data:
    name: Validar Dados Canônicos (XML & JSON)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências de Validação
        run: |
          pip install jsonschema lxml

      - name: Validar Estatuto Social (Akoma Ntoso 3.0 XML)
        run: |
          python scripts/validate_xml.py

      - name: Validar Agenda de Cultos (JSON Schema)
        run: |
          python scripts/validate_agenda.py

  validate-php:
    name: Validar PHP & Composer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, ctype, json, zip

      - name: Validar Composer Config
        run: |
          composer validate --strict

      - name: Instalar Dependências Composer
        run: |
          composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP Files
        run: |
          find public -name "*.php" -exec php -l {} \;
          if [ -d "src" ]; then find src -name "*.php" -exec php -l {} \;; fi

      - name: Executar Testes PHPUnit
        run: |
          composer test

  validate-assets:
    name: Compilar e Validar Tailwind CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências Node
        run: |
          npm install

      - name: Compilar Tailwind CSS
        run: |
          npm run build:css

      - name: Verificar se app.css foi gerado
        run: |
          test -s public/assets/css/app.css

  deploy:
    name: Deploy em Produção (Hostinger)
    runs-on: ubuntu-latest
    needs: [validate-data, validate-php, validate-assets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH na Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST || '185.211.7.156' }}
          SSH_USER: ${{ secrets.HOSTINGER_USER || 'u451023057' }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret HOSTINGER_SSH_KEY não configurado no repositório. Cadastre a chave privada SSH em Settings > Secrets and variables > Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "bash /home/$SSH_USER/scripts/deploy_ibnp_guapo.sh"
